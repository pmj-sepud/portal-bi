<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo TV — Portal BI Joinville/SC</title>
  <link rel="icon" href="assets/images/logo-prefeitura.png" type="image/png" />
  <style>
    :root {
      --bg: #0a1424;
      --surface: #0f1e35;
      --brand-400: #5fa0e6;
      --ink-100: #eaf1fb;
      --ink-400: #9db2cf;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; }
    #stage iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #fff;
      opacity: 0; transition: opacity .6s ease;
    }
    #stage iframe.is-active { opacity: 1; }

    #overlay {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 10px 22px; z-index: 10;
      background: linear-gradient(0deg, rgba(10,20,36,.92) 0%, rgba(10,20,36,0) 100%);
      color: var(--ink-100);
      opacity: .88; transition: opacity .4s ease;
      pointer-events: none;
    }
    #overlay.is-hidden { opacity: 0; }
    #overlay .logo { height: 26px; opacity: .9; }
    #overlay .nome { font-size: 15px; font-weight: 600; white-space: nowrap; }
    #overlay .clock { font-size: 13px; color: var(--ink-400); white-space: nowrap; margin-left: auto; }
    #overlay .barra {
      position: relative; flex: 1; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.14); overflow: hidden; max-width: 420px;
    }
    #overlay .barra i {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      background: var(--brand-400); border-radius: 4px;
    }
    #overlay .dots { display: flex; gap: 6px; }
    #overlay .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.28);
    }
    #overlay .dots span.on { background: var(--brand-400); }

    #splash {
      position: fixed; inset: 0; z-index: 20; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: var(--bg); color: var(--ink-100);
    }
    #splash img { height: 56px; }
    #splash .t { font-size: 20px; font-weight: 700; }
    #splash .s { font-size: 14px; color: var(--ink-400); }
    #splash.is-gone { display: none; }

    #anuncio {
      position: fixed; inset: 0; z-index: 15;
      display: flex; align-items: center; justify-content: center;
      background: rgba(6,12,22,.55); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none;
      transition: opacity .5s ease;
    }
    #anuncio.is-visivel { opacity: 1; }
    #anuncio .cartao {
      display: flex; align-items: center; gap: 22px;
      background: var(--surface); color: var(--ink-100);
      border-radius: 18px; padding: 26px 42px 26px 26px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      border-left: 8px solid var(--cor-atual, var(--brand-400));
      transform: scale(.94) translateY(10px);
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      max-width: 82vw;
    }
    #anuncio.is-visivel .cartao { transform: scale(1) translateY(0); }
    #anuncio .icone {
      width: 58px; height: 58px; border-radius: 14px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.08);
    }
    #anuncio .icone svg { width: 30px; height: 30px; stroke: var(--cor-atual, var(--brand-400)); }
    #anuncio .textos .rotulo {
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--cor-atual, var(--brand-400)); font-weight: 700; margin-bottom: 4px;
    }
    #anuncio .textos .nome { font-size: 32px; font-weight: 800; line-height: 1.15; }
    #anuncio .textos .desc { font-size: 15px; color: var(--ink-400); margin-top: 6px; max-width: 640px; }

    #overlay .nome { color: var(--cor-atual, var(--ink-100)); }
    #overlay .barra i { background: var(--cor-atual, var(--brand-400)); }
    #overlay .dots span.on { background: var(--cor-atual, var(--brand-400)); }
  </style>
</head>
<body>

  <div id="splash">
    <img src="assets/images/logo-prefeitura.png" alt="" />
    <div class="t">Portal BI — Joinville/SC</div>
    <div class="s">Carregando modo TV…</div>
  </div>

  <div id="stage"></div>

  <div id="overlay">
    <img class="logo" src="assets/images/logo-prefeitura.png" alt="" />
    <span class="nome" id="ov-nome">—</span>
    <div class="barra"><i id="ov-progresso"></i></div>
    <div class="dots" id="ov-dots"></div>
    <span class="clock" id="ov-relogio">—</span>
  </div>

  <div id="anuncio">
    <div class="cartao">
      <div class="icone"><svg id="an-icone" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg></div>
      <div class="textos">
        <div class="rotulo">Agora exibindo</div>
        <div class="nome" id="an-nome">—</div>
        <div class="desc" id="an-desc"></div>
      </div>
    </div>
  </div>

  <script src="assets/js/catalog.js"></script>
  <script>
    /**
     * Modo TV — roda os dashboards do catálogo em sequência, sem interação.
     * Parâmetros de URL opcionais:
     *   ?t=45        segundos por dashboard (padrão 45)
     *   ?recarga=4   horas até recarregar a página inteira (padrão 4, 0 = nunca)
     *   ?overlay=0   esconde a barra inferior (padrão visível)
     *   ?ids=todos   mostra todas as categorias do catálogo (por padrão, roda
     *                apenas a seleção fixa abaixo)
     *   ?anuncio=0   desliga o cartão de anúncio ao trocar de dashboard
     *   ?anuncio=6   segundos que o cartão de anúncio fica visível (padrão 4.5)
     *   ?scroll=0    desliga a rolagem automática dentro do dashboard
     *   ?chrome=1    mantém a barra/menu original da página (por padrão, some)
     */
    (function () {
      // Seleção fixa da rotação da TV. Para voltar a mostrar todas as
      // categorias do catálogo, acesse com ?ids=todos.
      var IDS_PADRAO = ["acidentes", "radares", "transporte", "waze", "rede-cicloviaria"];

      var params = new URLSearchParams(location.search);
      var SEGUNDOS = Math.max(8, parseInt(params.get("t"), 10) || 45);
      var HORAS_RECARGA = params.get("recarga") !== null ? parseFloat(params.get("recarga")) : 4;
      var MOSTRAR_OVERLAY = params.get("overlay") !== "0";
      var SEGUNDOS_ANUNCIO = params.get("anuncio") === "0" ? 0
        : Math.max(0, parseFloat(params.get("anuncio")) || 4.5);
      var ROLAR_AUTOMATICO = params.get("scroll") !== "0";
      var ESCONDER_CHROME = params.get("chrome") !== "1";
      var idsParam = params.get("ids");
      var idsFiltro = idsParam === "todos" ? null
        : idsParam ? idsParam.split(",").map(function (s) { return s.trim(); })
        : IDS_PADRAO;

      // A categoria "waze" é só um hub de cartões (sem gráficos); na TV
      // entra direto em cada um dos 5 sub-painéis, na ordem em que aparecem
      // naquela página.
      var SUBPAINEIS_WAZE = [
        { sufixo: "acidentes", nome: "Waze UMO — Acidentes" },
        { sufixo: "alagamentos", nome: "Waze UMO — Alagamentos" },
        { sufixo: "alertas", nome: "Waze UMO — Alertas Waze" },
        { sufixo: "buracos", nome: "Waze UMO — Buracos na Via" },
        { sufixo: "ranqueamento", nome: "Waze UMO — Ranqueamento Waze" }
      ];

      var categorias = (window.PORTAL_CATALOG && window.PORTAL_CATALOG.categorias) || [];
      var itens = [];
      categorias.forEach(function (c) {
        if (!c.href) return;
        if (idsFiltro && idsFiltro.indexOf(c.id) === -1) return;
        if (c.id === "waze") {
          SUBPAINEIS_WAZE.forEach(function (sp) {
            itens.push({
              id: "waze-" + sp.sufixo, nome: sp.nome, cor: c.cor, icone: c.icone,
              descricao: c.descricao, href: c.href + sp.sufixo + "/"
            });
          });
        } else {
          itens.push(c);
        }
      });

      var stage = document.getElementById("stage");
      var splash = document.getElementById("splash");
      var overlay = document.getElementById("overlay");
      var ovNome = document.getElementById("ov-nome");
      var ovProgresso = document.getElementById("ov-progresso");
      var ovDots = document.getElementById("ov-dots");
      var ovRelogio = document.getElementById("ov-relogio");
      var anuncio = document.getElementById("anuncio");
      var anIcone = document.getElementById("an-icone");
      var anNome = document.getElementById("an-nome");
      var anDesc = document.getElementById("an-desc");
      var timerAnuncio = null;

      if (!MOSTRAR_OVERLAY) overlay.style.display = "none";

      if (!itens.length) {
        splash.querySelector(".s").textContent = "Nenhum dashboard encontrado no catálogo.";
        return;
      }

      itens.forEach(function (it, i) {
        var d = document.createElement("span");
        d.dataset.i = i;
        ovDots.appendChild(d);
      });

      var frames = [null, null];
      var atual = 0;      // índice em `itens`
      var ativo = 0;       // qual das duas iframes está visível (0 ou 1)
      var timerTroca = null;
      var timerBarra = null;
      var geracao = 0;    // invalida rolagens de dashboards que já saíram de tela
      var rafScroll = null;

      // Some com a navbar/breadcrumb/rodapé original da página embutida —
      // a TV já tem seu próprio cartão de anúncio e barra de progresso.
      function esconderChromeDaPagina(frame) {
        if (!ESCONDER_CHROME) return;
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.head || doc.getElementById("tv-oculta-chrome")) return;
          var estilo = doc.createElement("style");
          estilo.id = "tv-oculta-chrome";
          estilo.textContent = ".pbi-chrome, .pbi-breadcrumb-wrap, .pbi-footer { display: none !important; }";
          doc.head.appendChild(estilo);
        } catch (e) { /* pagina de outra origem - ignora */ }
      }

      // Rola lentamente do topo ao fim do conteudo durante a janela de
      // exibicao, para paginas mais altas que a tela nao ficarem escondidas.
      function iniciarRolagemAutomatica(frame, minhaGeracao) {
        if (rafScroll) cancelAnimationFrame(rafScroll);
        if (!ROLAR_AUTOMATICO) return;

        var atrasoMs = Math.min(SEGUNDOS * 1000 * 0.4, Math.max(2000, SEGUNDOS_ANUNCIO * 1000));
        var folgaFinalMs = 1500;
        var duracaoMs = SEGUNDOS * 1000 - atrasoMs - folgaFinalMs;
        if (duracaoMs < 1500) return;

        setTimeout(function () {
          if (minhaGeracao !== geracao) return;
          var doc, alvo;
          try {
            doc = frame.contentDocument;
            alvo = doc && (doc.scrollingElement || doc.documentElement || doc.body);
          } catch (e) { return; }
          if (!doc || !alvo) return;

          var maxScroll = alvo.scrollHeight - frame.clientHeight;
          if (maxScroll < 80) return; // conteudo cabe inteiro, nada a rolar

          alvo.scrollTop = 0;
          var inicio = null;
          function passo(ts) {
            if (minhaGeracao !== geracao) return;
            if (inicio === null) inicio = ts;
            var progresso = Math.min(1, (ts - inicio) / duracaoMs);
            var suave = progresso < .5
              ? 2 * progresso * progresso
              : 1 - Math.pow(-2 * progresso + 2, 2) / 2;
            alvo.scrollTop = suave * maxScroll;
            if (progresso < 1) rafScroll = requestAnimationFrame(passo);
          }
          rafScroll = requestAnimationFrame(passo);
        }, atrasoMs);
      }

      function criarFrame() {
        var f = document.createElement("iframe");
        f.setAttribute("loading", "eager");
        f.setAttribute("referrerpolicy", "no-referrer-when-downgrade");
        stage.appendChild(f);
        return f;
      }
      frames[0] = criarFrame();
      frames[1] = criarFrame();

      function atualizarOverlay(item) {
        document.documentElement.style.setProperty("--cor-atual", item.cor || "var(--brand-400)");
        ovNome.textContent = item.nome;
        Array.prototype.forEach.call(ovDots.children, function (d, i) {
          d.classList.toggle("on", Number(d.dataset.i) === atual);
        });
      }

      function anunciar(item) {
        clearTimeout(timerAnuncio);
        if (SEGUNDOS_ANUNCIO <= 0) return;
        anIcone.innerHTML = item.icone || "";
        anNome.textContent = item.nome;
        anDesc.textContent = item.descricao || "";
        anuncio.classList.add("is-visivel");
        timerAnuncio = setTimeout(function () {
          anuncio.classList.remove("is-visivel");
        }, SEGUNDOS_ANUNCIO * 1000);
      }

      function animarBarra() {
        ovProgresso.style.transition = "none";
        ovProgresso.style.width = "0%";
        // força reflow antes de iniciar a transição
        void ovProgresso.offsetWidth;
        ovProgresso.style.transition = "width " + SEGUNDOS + "s linear";
        ovProgresso.style.width = "100%";
      }

      function mostrarAtual() {
        geracao++;
        var minhaGeracao = geracao;
        var item = itens[atual];
        var frame = frames[ativo];
        frame.src = item.href;
        frame.onload = function () {
          if (minhaGeracao !== geracao) return;
          esconderChromeDaPagina(frame);
          frame.classList.add("is-active");
          frames[1 - ativo].classList.remove("is-active");
          splash.classList.add("is-gone");
          iniciarRolagemAutomatica(frame, minhaGeracao);
        };
        atualizarOverlay(item);
        animarBarra();
        anunciar(item);
      }

      function proximo() {
        atual = (atual + 1) % itens.length;
        ativo = 1 - ativo;
        mostrarAtual();
      }

      function iniciar() {
        mostrarAtual();
        timerTroca = setInterval(proximo, SEGUNDOS * 1000);
      }

      function atualizarRelogio() {
        ovRelogio.textContent = new Date().toLocaleString("pt-BR", {
          weekday: "short", day: "2-digit", month: "2-digit",
          hour: "2-digit", minute: "2-digit"
        });
      }
      atualizarRelogio();
      setInterval(atualizarRelogio, 15000);

      // Recarrega a página inteira periodicamente para pegar publicações novas
      // (novo catálogo, novos dashboards, dados atualizados).
      if (HORAS_RECARGA > 0) {
        setTimeout(function () { location.reload(); }, HORAS_RECARGA * 3600 * 1000);
      }

      iniciar();
    })();
  </script>
</body>
</html>
