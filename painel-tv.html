<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel TV — Portal BI</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0f14; overflow: hidden;
    font-family: "DM Sans", -apple-system, Segoe UI, Arial, sans-serif;
  }
  #tela {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    border: none; background: #fff;
  }
  #overlay {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,0));
    color: #fff; z-index: 10;
    transition: opacity .5s ease;
    pointer-events: none;
  }
  #overlay.escondido { opacity: 0; }
  #dot-acc {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  #titulo { font-weight: 700; font-size: 20px; letter-spacing: .2px; }
  #contador { margin-left: auto; font-size: 14px; opacity: .8; font-variant-numeric: tabular-nums; }
  #pausado {
    font-size: 13px; background: rgba(255,255,255,.15); padding: 3px 10px;
    border-radius: 999px; display: none;
  }
  #pausado.ativo { display: inline-block; }
  #barra {
    position: fixed; left: 0; bottom: 0; height: 4px; width: 0%;
    background: #f5a623; z-index: 10; transition: background .3s ease;
  }
  #pontos {
    position: fixed; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 6px; z-index: 10;
    pointer-events: none;
  }
  #pontos span {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35);
  }
  #pontos span.atual { background: #fff; }
</style>
</head>
<body>

<iframe id="tela" title="Dashboard atual"></iframe>

<div id="overlay">
  <span id="dot-acc"></span>
  <span id="titulo"></span>
  <span id="pausado">PAUSADO</span>
  <span id="contador"></span>
</div>
<div id="barra"></div>
<div id="pontos"></div>

<script>
/* ------------------------------------------------------------------
   CONFIGURAÇÃO — edite aqui para mudar a ordem, o tempo ou os painéis.
   duracaoMs: tempo que cada painel fica na tela antes de trocar.
   ------------------------------------------------------------------ */
const duracaoMs = 30000;

const paineis = [
  { titulo: "Acidentes Bombeiros UMO",         url: "dashboards/acidentes/",         cor: "#dc2626" },
  { titulo: "Relatório de Análise dos Radares", url: "dashboards/radares/",           cor: "#ea580c" },
  { titulo: "Transporte Público UMO",          url: "dashboards/transporte/",        cor: "#0f766e" },
  { titulo: "Waze · Acidentes",                url: "dashboards/waze/acidentes/",    cor: "#d97706" },
  { titulo: "Waze · Alagamentos",              url: "dashboards/waze/alagamentos/",  cor: "#d97706" },
  { titulo: "Waze · Alertas",                  url: "dashboards/waze/alertas/",      cor: "#d97706" },
  { titulo: "Waze · Buracos na Via",           url: "dashboards/waze/buracos/",      cor: "#d97706" },
  { titulo: "Waze · Ranqueamento",             url: "dashboards/waze/ranqueamento/", cor: "#d97706" },
  { titulo: "Rede Cicloviária de Joinville",   url: "dashboards/rede-cicloviaria/",  cor: "#059669" },
];

/* -------------------------------- estado -------------------------------- */
const tela = document.getElementById("tela");
const overlay = document.getElementById("overlay");
const dotAcc = document.getElementById("dot-acc");
const tituloEl = document.getElementById("titulo");
const contadorEl = document.getElementById("contador");
const pausadoEl = document.getElementById("pausado");
const barra = document.getElementById("barra");
const pontosEl = document.getElementById("pontos");

let indice = 0;
let pausado = false;
let inicioSlide = Date.now();
let restanteAoP  = duracaoMs;
let timerSlide = null;
let esconderOverlayTimer = null;

paineis.forEach(() => {
  const span = document.createElement("span");
  pontosEl.appendChild(span);
});

function atualizarPontos() {
  [...pontosEl.children].forEach((el, i) => el.classList.toggle("atual", i === indice));
}

function mostrarOverlay() {
  overlay.classList.remove("escondido");
  clearTimeout(esconderOverlayTimer);
  esconderOverlayTimer = setTimeout(() => overlay.classList.add("escondido"), 4000);
}

function irPara(novoIndice) {
  indice = (novoIndice + paineis.length) % paineis.length;
  const p = paineis[indice];
  tela.src = p.url;
  tituloEl.textContent = p.titulo;
  dotAcc.style.background = p.cor;
  barra.style.background = p.cor;
  atualizarPontos();
  mostrarOverlay();
  inicioSlide = Date.now();
  restanteAoP = duracaoMs;
  reagendar();
}

function reagendar() {
  clearTimeout(timerSlide);
  if (pausado) return;
  timerSlide = setTimeout(() => irPara(indice + 1), restanteAoP);
}

function alternarPausa() {
  pausado = !pausado;
  pausadoEl.classList.toggle("ativo", pausado);
  mostrarOverlay();
  if (pausado) {
    clearTimeout(timerSlide);
    restanteAoP -= Date.now() - inicioSlide;
  } else {
    inicioSlide = Date.now();
    reagendar();
  }
}

/* barra de progresso + contador, atualizados a cada 250ms */
setInterval(() => {
  const passado = pausado ? duracaoMs - restanteAoP : Date.now() - inicioSlide;
  const pct = Math.min(100, (passado / duracaoMs) * 100);
  barra.style.width = pct + "%";
  const faltamS = Math.max(0, Math.ceil((duracaoMs - passado) / 1000));
  contadorEl.textContent = `${indice + 1}/${paineis.length} · próximo em ${faltamS}s`;
}, 250);

/* teclado: seta p/ navegar, espaço p/ pausar, F p/ tela cheia, R p/ recarregar */
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") irPara(indice + 1);
  else if (e.key === "ArrowLeft") irPara(indice - 1);
  else if (e.key === " ") { e.preventDefault(); alternarPausa(); }
  else if (e.key.toLowerCase() === "f") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  } else if (e.key.toLowerCase() === "r") tela.src = tela.src;
  mostrarOverlay();
});

document.addEventListener("mousemove", mostrarOverlay);
document.addEventListener("click", mostrarOverlay);

/* recarrega a página inteira de tempos em tempos (evita acúmulo de memória em TVs ligadas 24h) */
setTimeout(() => location.reload(), 4 * 60 * 60 * 1000);

irPara(0);
</script>
</body>
</html>
